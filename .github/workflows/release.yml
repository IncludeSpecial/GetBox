name: Release

# Push a tag vX.Y.Z on main → build the Windows portable exe and publish the
# GitHub release with the matching CHANGELOG.md section as its notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($expected)"; exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - name: Tests
        shell: bash
        run: |
          node scripts/verify-catalog.cjs --no-links
          node scripts/smoke.cjs
          node scripts/test-download.cjs
          node scripts/test-resilience.cjs
          node scripts/test-app-full.cjs
      - run: npm run build
      - name: Package portable exe
        run: npx electron-builder --win portable --publish never
      - name: Release notes
        id: notes
        shell: bash
        run: |
          node scripts/release-notes.cjs "$GITHUB_REF_NAME" > release-notes.md
          echo "name=GetBox ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          files: release/GetBox-*-portable.exe
          fail_on_unmatched_files: true
