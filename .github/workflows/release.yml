name: Release

# Build the Windows portable exe and publish the GitHub release with the
# matching CHANGELOG.md section as its notes. Two ways in:
#   - push a tag vX.Y.Z;
#   - run it from the Actions tab on main: the tag v<package.json version>
#     is created on that commit when the release is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($tag)"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists; bump the version in package.json first"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=GetBox ${tag#v}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - name: Tests
        shell: bash
        run: |
          node scripts/verify-catalog.cjs --no-links
          node scripts/smoke.cjs
          node scripts/test-download.cjs
          node scripts/test-resilience.cjs
          node scripts/test-app-full.cjs
      - run: npm run build
      - name: Package portable exe
        run: npx electron-builder --win portable --publish never
      - name: Release notes
        shell: bash
        run: node scripts/release-notes.cjs "${{ steps.meta.outputs.tag }}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-notes.md
          files: release/GetBox-*-portable.exe
          fail_on_unmatched_files: true
