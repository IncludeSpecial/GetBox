<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GetBox 1.3 — synthwave</title>
<style>
  /* Synthwave: neon sun over a running grid, a CRT monitor, VHS glitches on the cuts. 96 BPM. */
  :root { --pink: #ff2fd6; --cyan: #3df2ff; --sky0: #07011a; --sky1: #2a0b52; --sky2: #8a1a7a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; background: #000; }
  body { font-family: 'Inter Display', 'Inter', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'DejaVu Sans Mono', monospace; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0;
    background: linear-gradient(180deg, var(--sky0) 0%, var(--sky1) 42%, var(--sky2) 58%, #ff4d8d 61%); }
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; display: none; }

  #stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; }
  #sun { position: absolute; left: 660px; top: 260px; width: 600px; height: 600px; border-radius: 50%;
    background: linear-gradient(180deg, #ffe86b 0%, #ff9b3d 40%, #ff2fd6 85%);
    -webkit-mask: repeating-linear-gradient(180deg, #000 0 26px, transparent 26px 34px);
    filter: drop-shadow(0 0 60px rgba(255, 60, 160, .8)); }
  #mountains { position: absolute; left: 0; top: 470px; width: 1920px; height: 180px; }
  #floor { position: absolute; left: -400px; top: 640px; width: 2720px; height: 440px; perspective: 260px; perspective-origin: 50% 0; overflow: hidden;
    background: linear-gradient(180deg, #1a0435 0%, #08010f 100%); }
  #plane { position: absolute; left: 0; top: 0; width: 2720px; height: 2400px; transform-origin: 50% 0; transform: rotateX(78deg);
    background-image: linear-gradient(90deg, rgba(255,47,214,.9) 2px, transparent 2px), linear-gradient(0deg, rgba(255,47,214,.9) 2px, transparent 2px);
    background-size: 120px 120px; }
  #horizon { position: absolute; left: 0; right: 0; top: 636px; height: 8px; background: #ff7be8; filter: blur(3px); box-shadow: 0 0 40px 10px rgba(255,47,214,.7); }

  .chrome { font-weight: 900; font-style: italic; letter-spacing: .02em; line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #c9e6ff 38%, #4b2b8a 49%, #1b0b3a 51%, #ff8ee8 60%, #ffffff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 2px rgba(255,255,255,.55); filter: drop-shadow(0 6px 0 #3a0a5e) drop-shadow(0 0 30px rgba(255,47,214,.6)); }
  .neon { color: #fff; text-shadow: 0 0 6px var(--pink), 0 0 18px var(--pink), 0 0 42px var(--pink); }
  .neonC { color: #e8feff; text-shadow: 0 0 6px var(--cyan), 0 0 18px var(--cyan), 0 0 40px var(--cyan); }

  /* CRT monitor */
  #monitor { position: absolute; left: 380px; top: 236px; width: 1160px; height: 760px; border-radius: 34px; padding: 30px;
    background: linear-gradient(180deg, #2b2340, #120d1f); box-shadow: 0 0 0 3px #4a3a6e, 0 0 60px rgba(61,242,255,.35), 0 40px 80px rgba(0,0,0,.6); }
  #screen { position: relative; width: 1100px; height: 687.5px; border-radius: 18px; overflow: hidden; background: #000; }
  .cam { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
  .cam img { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; display: none; }
  #scan { position: absolute; inset: 0; pointer-events: none; z-index: 7;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,.22) 0 2px, transparent 2px 4px),
      radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0,0,0,.55) 100%); }
  #band { position: absolute; left: 0; right: 0; height: 90px; z-index: 8; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,.08), transparent); }
  #glitch { position: absolute; inset: 0; z-index: 9; pointer-events: none; }
  #glitch i { position: absolute; left: 0; right: 0; }
  .hl-box { position: absolute; border-radius: 6px; opacity: 0; pointer-events: none; z-index: 5;
    box-shadow: 0 0 0 3px var(--cyan), 0 0 26px 4px var(--cyan), 0 0 0 9999px rgba(12, 0, 30, .58); }
  .hl-tag { position: absolute; left: 0; top: 0; padding: 10px 18px; border-radius: 6px; background: var(--pink); color: #1a0030; z-index: 6;
    font: 800 26px 'Inter Display', sans-serif; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; opacity: 0;
    box-shadow: 0 0 24px rgba(255,47,214,.8); }

  #cap { position: absolute; left: 0; right: 0; top: 64px; text-align: center; }
  #capT { font-size: 66px; font-weight: 900; font-style: italic; letter-spacing: .04em; }
  #capS { margin-top: 14px; font: 600 28px 'DejaVu Sans Mono', monospace; letter-spacing: .08em; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 20; pointer-events: none; }
  #debug { position: absolute; right: 24px; bottom: 20px; padding: 8px 16px; background: #000; color: #ffd400;
    font: 600 30px 'DejaVu Sans Mono', monospace; display: none; z-index: 30; }
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div id="sun"></div>
  <svg id="mountains" viewBox="0 0 1920 180" preserveAspectRatio="none">
    <path d="M0 180 L0 120 L120 70 L230 110 L360 30 L470 100 L560 80 L640 130 L760 60 L880 120 L1000 150 L1100 90 L1210 130 L1330 40 L1450 110 L1560 70 L1680 120 L1800 60 L1920 110 L1920 180 Z" fill="#1a0533"/>
    <path d="M0 180 L0 150 L180 110 L300 150 L430 95 L560 150 L700 120 L820 160 L960 170 L1100 160 L1240 120 L1380 150 L1500 100 L1640 150 L1780 115 L1920 150 L1920 180 Z" fill="#0e021f"/>
  </svg>
  <div id="floor"><div id="plane"></div></div>
  <div id="horizon"></div>

  <!-- Intro and outro title -->
  <div class="scene" id="title">
    <div class="abs neonC" id="welcome" style="left:0;right:0;top:250px;text-align:center;font:600 40px 'DejaVu Sans Mono',monospace;letter-spacing:.3em">ДОБРО ПОЖАЛОВАТЬ В</div>
    <div class="abs" id="logoWrap" style="left:0;right:0;top:300px;text-align:center">
      <div class="chrome" id="logoT" style="display:inline-block;font-size:260px">GETBOX</div>
    </div>
    <div class="abs neon" id="ver" style="left:0;right:0;top:590px;text-align:center;font-size:80px;font-weight:900;font-style:italic;letter-spacing:.1em">1.3</div>
    <div class="abs" id="ctaWrap" style="left:0;right:0;top:770px;text-align:center">
      <span id="cta" style="display:inline-block;padding:22px 60px;border:4px solid var(--cyan);border-radius:12px;font-size:46px;font-weight:900;letter-spacing:.08em;box-shadow:0 0 30px var(--cyan), inset 0 0 30px rgba(61,242,255,.5)" class="neonC">СКАЧАТЬ БЕСПЛАТНО</span>
      <div class="mono neon" id="url" style="margin-top:28px;font-size:30px;letter-spacing:.06em">github.com/IncludeSpecial/GetBox</div>
    </div>
  </div>

  <!-- The monitor, with captions above it -->
  <div class="scene" id="tv">
    <div id="cap"><div id="capT" class="neon"></div><div id="capS" class="neonC"></div></div>
    <div id="monitor"><div id="screen">
      <div class="cam" id="cam"></div>
      <div class="hl-box" id="hb"></div><div class="hl-tag" id="ht"></div>
      <div id="band"></div><div id="scan"></div><div id="glitch"></div>
    </div></div>
  </div>

  <div id="flash"></div>
  <div id="debug"></div>
</div>

<script src="director.js"></script>
<script>
  const BPM = 96, B = 60 / BPM, DURATION = 52 * B + 1.5;
  const params = new URLSearchParams(location.search);
  const OUT_H = Number(params.get('h') || 1080), OUT_W = Math.round(OUT_H * 16 / 9 / 2) * 2;
  window.FORMAT = { width: OUT_W, height: OUT_H, fps: Number(params.get('fps') || 30), duration: DURATION };
  const $ = (id) => document.getElementById(id);
  $('stage').style.transform = `scale(${OUT_W / 1920})`;
  document.body.style.width = OUT_W + 'px'; document.body.style.height = OUT_H + 'px';
  if (params.get('debug')) $('debug').style.display = 'block';
  const { clamp, seg, lerp, inOut, outCubic } = Director;
  const outBack = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
  // Deterministic noise for stars and glitches.
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const hash = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

  const STARS = Array.from({ length: 160 }, () => ({ x: rnd() * 1920, y: rnd() * 560, s: 1 + rnd() * 2.5, p: rnd() * 6.28 }));
  $('stars').innerHTML = STARS.map((s) => `<i style="left:${s.x}px;top:${s.y}px;width:${s.s}px;height:${s.s}px"></i>`).join('');
  const starEls = [...$('stars').children];

  // Screens on the monitor, 8 beats each; the camera only stops on measured elements.
  const VIEW = { w: 1100, h: 687.5 };
  const SEGS = [
    { at: 12, shot: 'home-classic', title: 'ВСЕ ПРОГРАММЫ · ОДНО ОКНО', sub: 'установщики с официальных сайтов · проверка SHA256',
      focus: [{ key: 'hero', label: 'Выбор редакции', at: 2, until: 4.4 }, { key: 'heroCta', frame: 'heroActions', label: 'Один клик', at: 5, until: 7.6 }] },
    { at: 20, shot: 'feat-search', title: 'ТЫСЯЧИ ПАКЕТОВ', sub: 'каталог GetBox + winget + Scoop + Chocolatey',
      focus: [{ key: 'search', label: 'Один поиск', at: 2, until: 4.4 }, { key: 'results', label: 'Все источники сразу', at: 5, until: 7.6 }] },
    { at: 28, shot: 'updates', title: 'ОБНОВЛЕНИЯ И ОТКАТ', sub: 'всё устаревшее — на одной вкладке',
      focus: [{ key: 'pending', label: 'Ждут обновления', at: 2, until: 4.4 }, { key: 'rollback', frame: 'history', label: 'Откат в один клик', at: 5, until: 7.6 }] },
    { at: 36, shot: 'themes', title: 'ПЯТЬ ТЕМ', sub: '', focus: [] },
  ];
  const THEMES = [['home-classic', 'КЛАССИКА'], ['home-light', 'СВЕТЛАЯ'], ['home-oled', 'OLED'], ['home-contrast', 'ВЫСОКИЙ КОНТРАСТ'], ['home-mica', 'WINDOWS 11']];
  const SHOTS = [...new Set([...SEGS.slice(0, 3).map((s) => s.shot), ...THEMES.map(([s]) => s)])];
  $('cam').innerHTML = SHOTS.map((s) => `<img src="shots/13/${s}.png" alt="" data-shot="${s}">`).join('');
  const imgs = Object.fromEntries([...$('cam').children].map((el) => [el.dataset.shot, el]));
  SEGS.forEach((s) => {
    s.stops = [{ at: 0, rect: Director.FULL }, ...s.focus.map((p) => ({ at: p.at * B, rect: Director.fit(s.shot, p.frame || p.key, { pad: 60, maxZoom: 1.9 }) }))];
  });
  $('glitch').innerHTML = Array.from({ length: 9 }, () => '<i></i>').join('');
  const bars = [...$('glitch').children];

  /** VHS glitch strength around beat-cut c (in beats). */
  const glitchAt = (bt, c) => Math.max(0, 1 - Math.abs(bt - c) / 0.35);

  window.render = function render(t) {
    const bt = t / B;
    $('debug').textContent = `${t.toFixed(2)} с · доля ${bt.toFixed(1)}`;
    seed = 7 + Math.floor(t * 30);

    // World: the grid runs toward us, the sun rises in the intro and pulses on the kick.
    $('plane').style.backgroundPosition = `0 ${(t * 240) % 120}px`;
    const rise = outCubic(seg(t, 0, 4.5));
    const pulse = bt >= 8 && bt < 48 ? Math.exp(-((bt % 1) * 6)) : 0;
    $('sun').style.transform = `translateY(${(1 - rise) * 260}px) scale(${1 + pulse * 0.015})`;
    $('sun').style.filter = `drop-shadow(0 0 ${60 + pulse * 40}px rgba(255, 60, 160, .85))`;
    starEls.forEach((el, i) => { el.style.opacity = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.7 + STARS[i].p)); });

    // Flash on the drop (beat 8) and on the outro.
    $('flash').style.opacity = Math.max(1 - seg(bt, 8, 9), 0) * (bt >= 8 ? 0.85 : 0) + Math.max(1 - seg(bt, 44, 44.8), 0) * (bt >= 44 ? 0.6 : 0);

    // Title: intro (0–12) and outro (44–end).
    const intro = bt < 12, outro = bt >= 44;
    $('title').style.display = intro || outro ? 'block' : 'none';
    if (intro) {
      const wk = seg(bt, 1.5, 3) * (1 - seg(bt, 4.8, 5.6));
      $('welcome').style.opacity = wk;
      $('welcome').style.letterSpacing = `${0.3 + (1 - wk) * 0.2}em`;
      const fly = seg(bt, 5.5, 8);
      const z = Math.pow(fly, 3);
      $('logoT').style.opacity = fly > 0 ? Math.min(1, fly * 3) : 0;
      $('logoT').style.transform = `scale(${lerp(0.05, 1, z)}) translateY(${(1 - z) * 140}px)`;
      // Light sweep across the chrome after it lands.
      const sh = seg(bt, 8.4, 10);
      $('logoT').style.backgroundPosition = '0 0';
      $('logoT').style.filter = `drop-shadow(0 6px 0 #3a0a5e) drop-shadow(0 0 ${30 + 30 * Math.sin(sh * Math.PI)}px rgba(255,47,214,.7)) brightness(${1 + 0.35 * Math.sin(sh * Math.PI)})`;
      const out = seg(bt, 11, 12);
      $('logoWrap').style.opacity = 1 - out;
      $('logoWrap').style.transform = `translateY(${-out * 80}px)`;
      $('ver').style.opacity = 0; $('ctaWrap').style.opacity = 0;
    } else if (outro) {
      $('welcome').style.opacity = 0;
      const lk = outBack(clamp(seg(bt, 44, 45.2)));
      $('logoWrap').style.opacity = 1;
      $('logoWrap').style.transform = `translateY(${(1 - seg(bt, 44, 45)) * -60}px)`;
      $('logoT').style.opacity = 1;
      $('logoT').style.transform = `scale(${lerp(0.6, 1, lk)})`;
      $('logoT').style.filter = 'drop-shadow(0 6px 0 #3a0a5e) drop-shadow(0 0 30px rgba(255,47,214,.6))';
      $('ver').style.opacity = seg(bt, 45, 46) * (0.85 + 0.15 * Math.sin(t * 20 * (bt < 47 ? 1 : 0)));
      const ck = seg(bt, 46.5, 47.5);
      $('ctaWrap').style.opacity = ck;
      $('ctaWrap').style.transform = `translateY(${(1 - outCubic(ck)) * 30}px)`;
      $('stage').style.opacity = 1 - seg(t, DURATION - 0.8, DURATION);
    }

    // Monitor: rises from the horizon at 12, sinks at 44.
    const onTv = bt >= 11 && bt < 44.5;
    $('tv').style.display = onTv ? 'block' : 'none';
    if (!onTv) return;
    const up = outCubic(seg(bt, 11, 13)), down = inOut(seg(bt, 43.4, 44.5));
    $('monitor').style.transform = `translateY(${(1 - up) * 820 + down * 820}px) rotateX(${(1 - up) * 30}deg)`;
    const si = clamp(Math.floor((bt - 12) / 8), 0, SEGS.length - 1);
    const s = SEGS[si];
    const lb = bt - s.at;

    // Caption: neon flicker on as each screen begins.
    const capK = seg(lb, 0, 0.6) * (1 - seg(bt, 43.2, 43.8));
    const flick = lb < 0.6 ? (hash(Math.floor(t * 30)) > 0.4 ? 1 : 0.25) : 1;
    $('capT').textContent = s.shot === 'themes' ? `${s.title}` : s.title;
    $('capT').style.opacity = capK * flick;
    let sub = s.sub;
    let shot = s.shot;
    let cam;
    if (s.shot === 'themes') {
      const ti = clamp(Math.floor(lb - 1), 0, 4);
      shot = THEMES[ti][0];
      sub = `${ti + 1} / 5 · ${THEMES[ti][1]}`;
      cam = Director.apply($('cam'), VIEW.w, VIEW.h, Director.FULL);
    } else {
      cam = Director.apply($('cam'), VIEW.w, VIEW.h, Director.camera(s.stops, lb * B, B * 1.3));
    }
    $('capS').textContent = sub;
    $('capS').style.opacity = seg(lb, 0.4, 1) * (1 - seg(bt, 43.2, 43.8));
    Object.entries(imgs).forEach(([k, el]) => { el.style.display = k === shot ? 'block' : 'none'; });

    const box = $('hb'), tag = $('ht');
    const p = s.focus.find((p) => lb >= p.at + 0.1 && lb < p.until);
    if (p) {
      if (tag.textContent !== p.label) tag.textContent = p.label;
      const hk = outCubic(seg(lb, p.at + 0.1, p.at + 0.6)) * (1 - seg(lb, p.until - 0.4, p.until));
      Director.highlight(box, tag, null, cam, Director.mark(s.shot, p.key), hk, VIEW.w, VIEW.h);
    } else { box.style.opacity = 0; tag.style.opacity = 0; }

    // Rolling band and VHS glitch on every screen change (and on theme cuts).
    $('band').style.top = `${((t * 220) % 900) - 120}px`;
    let g = 0;
    for (const c of [20, 28, 36, 38, 39, 40, 41]) g = Math.max(g, glitchAt(bt, c) * (c > 36 ? 0.6 : 1));
    g = Math.max(g, glitchAt(bt, 12.6) * 0.8);
    bars.forEach((el, i) => {
      const on = g > 0 && hash(i * 13 + Math.floor(t * 30)) < g * 0.8;
      el.style.display = on ? 'block' : 'none';
      if (!on) return;
      const y = hash(i * 7.3 + Math.floor(t * 30)) * 690, h = 6 + hash(i * 3.1 + Math.floor(t * 30)) * 40;
      el.style.top = y + 'px'; el.style.height = h + 'px';
      el.style.background = ['rgba(255,47,214,.55)', 'rgba(61,242,255,.5)', 'rgba(255,255,255,.35)'][i % 3];
      el.style.transform = `translateX(${(hash(i + t) - 0.5) * 120 * g}px)`;
    });
    const jx = g > 0 ? (hash(Math.floor(t * 30) * 1.7) - 0.5) * 50 * g : 0;
    $('cam').style.filter = g > 0 ? `hue-rotate(${g * 70}deg) saturate(${1 + g}) contrast(${1 + g * 0.4})` : '';
    $('cam').style.marginLeft = jx + 'px';
  };
  window.render(0);
</script>
</body>
</html>
