<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GetBox 1.3 — lo-fi</title>
<style>
  /* Lo-fi desk: paper, a sticky note, polaroids and a mug. Objects move on twos (12 fps, stop motion);
     text is typed. 82 BPM. */
  :root { --paper: #efe4d0; --ink: #3b2f2a; --soft: #8a7a6a; --orange: #e07a3f; --sage: #7c9a6d; --note: #f6d870; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; background: var(--paper); }
  body { font-family: 'FreeMono', monospace; color: var(--ink); }
  .serif { font-family: 'FreeSerif', serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0;
    background: radial-gradient(1400px 900px at 55% 40%, #f6eddc 0%, var(--paper) 55%, #ddcfb6 100%); }
  .abs { position: absolute; }
  #grain { position: absolute; left: -100px; top: -100px; width: 2120px; height: 1280px; opacity: .16; mix-blend-mode: multiply; pointer-events: none; z-index: 20; }
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 19; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(80, 50, 20, .28) 100%); }

  #note { position: absolute; left: 110px; top: 130px; width: 520px; height: 560px; padding: 54px 46px; background: var(--note);
    box-shadow: 0 18px 30px rgba(80, 55, 20, .22), inset 0 -30px 40px rgba(180, 140, 30, .15); z-index: 4; }
  #note h3 { font: italic 700 54px 'FreeSerif', serif; }
  #note ul { list-style: none; margin-top: 40px; display: flex; flex-direction: column; gap: 38px; }
  #note li { position: relative; font-size: 44px; font-weight: 700; padding-left: 64px; min-height: 44px; }
  #note li .bx { position: absolute; left: 0; top: 4px; width: 38px; height: 38px; border: 3px solid var(--ink); border-radius: 4px; }
  #note li svg { position: absolute; left: -6px; top: -14px; overflow: visible; }
  #note li svg path { fill: none; stroke: var(--orange); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .tape { position: absolute; width: 150px; height: 44px; background: rgba(245, 238, 220, .78); box-shadow: 0 2px 4px rgba(0,0,0,.08); }

  #strip { position: absolute; left: 110px; top: 760px; width: 560px; padding: 22px 28px; background: #fffaf0; z-index: 4;
    box-shadow: 0 10px 20px rgba(80,55,20,.15); font-size: 32px; font-weight: 700; line-height: 1.35; min-height: 92px; }
  .caret { display: inline-block; width: 16px; height: 32px; background: var(--ink); vertical-align: -5px; margin-left: 4px; }

  .pol { position: absolute; padding: 22px 22px 86px; background: #fffdf8; box-shadow: 0 24px 40px rgba(80, 55, 20, .25); z-index: 3; }
  .pol .photo { position: relative; overflow: hidden; background: #222; }
  .pol .cap { position: absolute; left: 26px; right: 26px; bottom: 22px; font: italic 700 34px 'FreeSerif', serif; color: var(--ink); }
  .cam { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
  .cam img { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; }
  .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,200,120,.10), rgba(60,30,0,.08)); pointer-events: none; z-index: 7; }
  .hl-box { position: absolute; border-radius: 14px; opacity: 0; pointer-events: none; z-index: 5;
    box-shadow: 0 0 0 5px var(--orange), 0 0 0 9999px rgba(239, 228, 208, .5); }
  .hl-tag { position: absolute; left: 0; top: 0; padding: 10px 20px; background: #fffaf0; color: var(--ink); z-index: 6;
    font: 700 30px 'FreeMono', monospace; white-space: nowrap; opacity: 0; box-shadow: 0 8px 16px rgba(80,55,20,.25); }

  #mug { position: absolute; left: 1640px; top: 850px; width: 230px; height: 230px; z-index: 5; }
  #steam path { fill: none; stroke: rgba(255,255,255,.75); stroke-width: 9; stroke-linecap: round; }
  #words { position: absolute; left: 760px; top: 300px; width: 1050px; z-index: 2; }
  #words div { font: italic 700 92px 'FreeSerif', serif; line-height: 1.15; }
  #end { position: absolute; left: 760px; top: 220px; width: 1050px; z-index: 2; text-align: center; }
  #debug { position: absolute; right: 24px; bottom: 20px; padding: 8px 16px; background: #000; color: #ffd400;
    font: 600 30px 'DejaVu Sans Mono', monospace; display: none; z-index: 30; }
</style>
</head>
<body>
<div id="stage">
  <!-- Opening words, right side -->
  <div id="words"><div id="w1"></div><div id="w2" style="color:var(--orange)"></div></div>

  <!-- Sticky note: today's list -->
  <div id="note">
    <div class="tape" style="left:180px;top:-22px;transform:rotate(-4deg)"></div>
    <h3 id="noteH"></h3>
    <ul id="list"></ul>
  </div>
  <div id="strip"><span id="stripT"></span><span class="caret" id="caret"></span></div>

  <div id="pols"></div>
  <div id="themes"></div>

  <!-- Ending -->
  <div id="end">
    <img id="endLogo" src="../data/logo.png" alt="" style="width:170px;height:170px">
    <div class="serif" id="endName" style="margin-top:26px;font-size:120px;font-weight:700;font-style:italic">GetBox 1.3</div>
    <div id="endSub" style="margin-top:10px;font-size:40px;font-weight:700"></div>
    <div id="endUrl" style="margin-top:44px;display:inline-block;padding:16px 30px;background:#fffaf0;box-shadow:0 10px 20px rgba(80,55,20,.15);font-size:32px;font-weight:700"></div>
  </div>

  <svg id="mug" viewBox="0 0 230 230" aria-hidden="true">
    <g id="steam"><path id="st0" d="M80 70 C60 50 100 35 80 10"/><path id="st1" d="M115 70 C95 45 135 30 115 0"/><path id="st2" d="M150 70 C130 50 170 35 150 10"/></g>
    <path d="M178 110 C230 110 230 175 175 175" fill="none" stroke="#c4553c" stroke-width="18"/>
    <rect x="50" y="80" width="140" height="150" rx="18" fill="#d9644a"/>
    <ellipse cx="120" cy="82" rx="70" ry="14" fill="#7a3b22"/>
  </svg>

  <svg id="grain" aria-hidden="true"><filter id="nf"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#nf)"/></svg>
  <div id="vignette"></div>
  <div id="debug"></div>
</div>

<script src="director.js"></script>
<script>
  const BPM = 82, B = 60 / BPM, DURATION = 48 * B + 1.6;
  const params = new URLSearchParams(location.search);
  const OUT_H = Number(params.get('h') || 1080), OUT_W = Math.round(OUT_H * 16 / 9 / 2) * 2;
  window.FORMAT = { width: OUT_W, height: OUT_H, fps: Number(params.get('fps') || 30), duration: DURATION };
  const $ = (id) => document.getElementById(id);
  $('stage').style.transform = `scale(${OUT_W / 1920})`;
  document.body.style.width = OUT_W + 'px'; document.body.style.height = OUT_H + 'px';
  if (params.get('debug')) $('debug').style.display = 'block';
  const { clamp, seg, lerp, inOut, outCubic } = Director;
  const hash = (n) => { const x = Math.sin(n * 127.1 + 3.7) * 43758.5453; return x - Math.floor(x); };
  const outBack = (x) => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
  /** Typed text: n characters of s at local beat lb, `cps` characters per beat. */
  const typed = (s, lb, at, cps = 10) => s.slice(0, Math.max(0, Math.floor((lb - at) * cps)));

  // Today's list; each item gets a hand-drawn check while the profiles scene plays.
  const ITEMS = ['браузер', 'музыка', 'редактор кода', 'игры'];
  $('list').innerHTML = ITEMS.map((_, i) => `<li><span class="bx"></span><svg width="70" height="70" viewBox="0 0 70 70"><path id="ck${i}" d="M8 38 L26 56 L64 10"/></svg><span id="it${i}"></span></li>`).join('');
  ITEMS.forEach((_, i) => { const p = $(`ck${i}`); const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });

  // Polaroids: one per scene, the camera drifts calmly and only stops on measured elements.
  const PH = { w: 1040, h: 650 };
  const POLS = [
    { at: 8, shot: 'L-home', cap: 'всё в одном окне', strip: 'getbox — магазин программ для windows',
      focus: [{ key: 'heroCta', frame: 'heroActions', label: 'один клик', at: 3.5, until: 7.4 }] },
    { at: 16, shot: 'feat-profiles', cap: 'наборы на любой случай', strip: 'целый набор — одной кнопкой',
      focus: [{ key: 'profiles', label: 'готовые наборы', at: 2.5, until: 7.4 }] },
    { at: 24, shot: 'L-updates', cap: 'обновления по расписанию', strip: 'обновления напомнят о себе сами',
      focus: [{ key: 'pending', label: 'ждут обновления', at: 2, until: 4.6 }, { key: 'rollback', frame: 'history', label: 'можно откатить', at: 5, until: 7.4 }] },
  ];
  POLS.forEach((p, i) => {
    p.stops = [{ at: 0, rect: Director.FULL }, ...p.focus.map((f) => ({ at: f.at * B, rect: Director.fit(p.shot, f.frame || f.key, { pad: 80, maxZoom: 1.7 }) }))];
    p.rot = [-1.8, 1.4, -1.1][i];
  });
  $('pols').innerHTML = POLS.map((p, i) => `<div class="pol" id="pol${i}" style="left:740px;top:110px">
      <div class="tape" style="left:430px;top:-20px;transform:rotate(3deg)"></div>
      <div class="photo" style="width:${PH.w}px;height:${PH.h}px"><div class="cam" id="pc${i}"><img src="shots/13/${p.shot}.png" alt=""></div>
        <div class="hl-box" id="hb${i}"></div><div class="hl-tag" id="ht${i}"></div></div>
      <div class="cap">${p.cap}</div></div>`).join('');

  // Five theme polaroids, dealt one per beat.
  const THEMES = [['home-classic', 'классика'], ['home-light', 'светлая'], ['home-oled', 'oled'], ['home-contrast', 'контраст'], ['home-mica', 'windows 11']];
  const TP = { w: 352, h: 220 };
  const TPOS = [[730, 130, -4], [1110, 110, 3], [1490, 140, -2], [900, 520, 2.5], [1290, 530, -3]];
  $('themes').innerHTML = THEMES.map(([s, name], i) => `<div class="pol" id="tp${i}" style="left:${TPOS[i][0]}px;top:${TPOS[i][1]}px;padding:14px 14px 62px">
      <div class="photo" style="width:${TP.w}px;height:${TP.h}px"><div class="cam" id="tc${i}"><img src="shots/13/${s}.png" alt=""></div></div>
      <div class="cap" style="font-size:28px;left:18px;bottom:14px">${name}</div></div>`).join('');
  THEMES.forEach((_, i) => Director.apply($(`tc${i}`), TP.w, TP.h, Director.FULL));

  const STRIPS = [[0, ''], ...POLS.map((p) => [p.at, p.strip]), [32, 'под любое настроение'], [40, 'всё готово. можно работать']];

  window.render = function render(t) {
    const bt = t / B;
    $('debug').textContent = `${t.toFixed(2)} с · доля ${bt.toFixed(1)}`;
    // Stop motion: objects move on twos (12 fps) and "boil" a little every 1/6 s.
    const tq = Math.floor(t * 12) / 12, bq = tq / B;
    const boil = (id, amp = 0.35) => (hash(Math.floor(t * 6) * 3.1 + id * 17.7) - 0.5) * amp;
    $('grain').style.transform = `translate(${hash(Math.floor(t * 12)) * 100 - 50}px, ${hash(Math.floor(t * 12) + 5) * 100 - 50}px)`;

    // Steam drifts up and loops.
    for (let i = 0; i < 3; i++) {
      const ph = ((t * 0.5 + i / 3) % 1);
      $(`st${i}`).style.transform = `translateY(${-ph * 40}px)`;
      $(`st${i}`).style.opacity = Math.sin(ph * Math.PI) * 0.9;
    }

    // Sticky note slides in at the start, stays all along.
    const nk = outBack(clamp(seg(bq, 0.2, 1.4)));
    $('note').style.transform = `translate(${(1 - nk) * -700}px, 0) rotate(${-3 + boil(1)}deg)`;
    $('noteH').textContent = typed('сегодня:', bt, 1.2, 12);
    ITEMS.forEach((s, i) => {
      $(`it${i}`).textContent = typed(s, bt, 2.4 + i * 1.1, 14);
      const p = $(`ck${i}`), L = Number(p.dataset.len);
      const ck = seg(bt, 19 + i * 1.2, 19.5 + i * 1.2);     // checked during the profiles scene
      p.style.strokeDashoffset = L * (1 - ck);
    });
    $('list').querySelectorAll('li .bx').forEach((el, i) => { el.style.opacity = bt >= 2.4 + i * 1.1 ? 1 : 0; });

    // Caption strip under the note: typed per scene.
    const cur = [...STRIPS].reverse().find(([a]) => bt >= a);
    $('stripT').textContent = typed(cur[1], bt, cur[0] + 0.6, 16);
    $('strip').style.opacity = bt >= 8 ? 1 : 0;
    $('strip').style.transform = `rotate(${1.2 + boil(2, 0.3)}deg)`;
    $('caret').style.opacity = Math.floor(t * 2.6) % 2 ? 0 : 1;

    // Opening words.
    $('w1').textContent = typed('Новый компьютер.', bt, 1.5, 9);
    $('w2').textContent = typed('Что ставим первым?', bt, 4, 9);
    $('words').style.opacity = 1 - seg(bq, 7.2, 7.8);
    $('words').style.transform = `translateY(${-seg(bq, 7.2, 7.8) * 40}px)`;

    // Polaroids: each drops in from above on its beat and slides off to the right when the next arrives.
    POLS.forEach((p, i) => {
      const el = $(`pol${i}`);
      const inK = outBack(clamp(seg(bq, p.at - 0.4, p.at + 0.8)));
      const outK = inOut(seg(bq, p.at + 7.6, p.at + 8.4));
      const vis = bq >= p.at - 0.4 && bq < p.at + 8.4;
      el.style.display = vis ? 'block' : 'none';
      if (!vis) return;
      el.style.transform = `translate(${outK * 1300}px, ${(1 - inK) * -1100}px) rotate(${p.rot + (1 - inK) * 8 + outK * 10 + boil(10 + i)}deg)`;
      const lb = bt - p.at;
      const cam = Director.apply($(`pc${i}`), PH.w, PH.h, Director.camera(p.stops, lb * B, B * 2));
      const box = $(`hb${i}`), tag = $(`ht${i}`);
      const f = p.focus.find((f) => lb >= f.at + 0.2 && lb < f.until);
      if (!f) { box.style.opacity = 0; tag.style.opacity = 0; return; }
      if (tag.textContent !== f.label) tag.textContent = f.label;
      const hk = outCubic(seg(lb, f.at + 0.2, f.at + 0.8)) * (1 - seg(lb, f.until - 0.5, f.until));
      Director.highlight(box, tag, null, cam, Director.mark(p.shot, f.key), hk, PH.w, PH.h);
      tag.style.transform += ` rotate(-1.5deg)`;
    });

    // Themes: dealt on beats 33–37, cleared at 40.
    THEMES.forEach((_, i) => {
      const el = $(`tp${i}`);
      const a = 33 + i;
      const inK = outBack(clamp(seg(bq, a - 0.3, a + 0.5)));
      const outK = inOut(seg(bq, 39.6 + i * 0.1, 40.4 + i * 0.1));
      const vis = bq >= a - 0.3 && bq < 40.6 + i * 0.1;
      el.style.display = vis ? 'block' : 'none';
      if (!vis) return;
      el.style.transform = `translate(${outK * 1400}px, ${(1 - inK) * 900}px) rotate(${TPOS[i][2] + (1 - inK) * -12 + boil(20 + i)}deg)`;
    });

    // Ending: logo stamped, name, line, url typed.
    const eb = bt - 40.6;
    $('end').style.display = eb >= 0 ? 'block' : 'none';
    if (eb >= 0) {
      const sk = clamp(seg(eb, 0, 0.35));
      $('endLogo').style.transform = `scale(${lerp(1.8, 1, outCubic(sk))}) rotate(${-6 + boil(30, 1)}deg)`;
      $('endLogo').style.opacity = sk > 0 ? 1 : 0;
      $('endName').style.opacity = seg(eb, 0.8, 1.4);
      $('endSub').textContent = typed('бесплатно · для windows 10 и 11', eb, 1.6, 16);
      $('endUrl').textContent = typed('github.com/IncludeSpecial/GetBox', eb, 3.6, 18);
      $('endUrl').style.opacity = eb >= 3.6 ? 1 : 0;
      $('stage').style.opacity = 1 - seg(t, DURATION - 0.9, DURATION);
    } else $('stage').style.opacity = 1;
  };
  window.render(0);
</script>
</body>
</html>
